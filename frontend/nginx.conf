server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: 编辑器扩展已同源化到 /unpkg/（见下方反代），script-src 无需放行外部 CDN
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'" always;

    client_max_body_size 1024m;

    # Deny hidden files (.env, .git, etc)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 限速：AI 聊天接口
    location = /api/v1/ai/chat {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # API 代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件代理（后端端点是 /api/v1/upload/{id}）
    location /api/v1/upload {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 兼容旧的 /upload/{id} URL（数据库中已有数据）
    location /upload {
        proxy_pass http://backend:8000/api/v1/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend:8000;
    }

    # 静态资源强缓存（Vite 构建产出带 hash，可永久缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 同源反代 unpkg.com：md-editor-v3 运行时懒加载的扩展模块
    # （highlight.js/katex/mermaid/echarts/cropperjs/prettier/screenfull）
    # 用户网络直连 unpkg 不可靠，由服务器代取；版本号路径由前端代码固定
    location /unpkg/ {
        proxy_pass https://unpkg.com/;
        proxy_set_header Host unpkg.com;
        proxy_ssl_server_name on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Service Worker 不缓存（确保更新及时）
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # manifest
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    # expires -1 → Cache-Control: no-cache：index.html 必须每次 revalidate，
    # 否则无 Cache-Control 时浏览器按启发式缓存旧页面，部署后迟迟不更新
    # （用 expires 而非 add_header，避免该 location 丢失 server 级安全头的继承）
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
