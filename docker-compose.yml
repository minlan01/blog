services:
  backend:
    build: ./backend
    container_name: blog-backend
    ports:
      - "6965:8000"
    volumes:
      - blog-data:/app/data
      - blog-uploads:/app/uploads
    environment:
      - SQLITE_DB_PATH=/app/data/blog.db
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3710,http://127.0.0.1:3710
      - SECRET_KEY=${SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: blog-frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  blog-data:
  blog-uploads:
