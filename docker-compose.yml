# ──────────────────────────────────────────────
#  Personal Blog — Docker Compose (SQLite + HTTPS)
#  Caddy 自动 SSL + Nginx 前端 + FastAPI 后端
# ──────────────────────────────────────────────
services:
  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: blog-backend
    expose:
      - "8000"
    volumes:
      - blog-data:/app/data
      - blog-uploads:/app/uploads
    environment:
      - APP_NAME=Personal Blog API
      - API_V1_PREFIX=/api/v1
      - DATABASE_BACKEND=sqlite
      - SQLITE_DB_PATH=/app/data/blog.db
      - CORS_ORIGINS=${CORS_ORIGINS:-https://chiyeblog.cn,https://www.chiyeblog.cn}
      - SECRET_KEY=${SECRET_KEY:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?must set in .env}
      - ENV=production
      - SITE_URL=${SITE_URL:-https://chiyeblog.cn}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-1024}
      - UPLOAD_ALLOWED_TYPES=${UPLOAD_ALLOWED_TYPES:-image/png,image/jpeg,image/gif,image/webp,image/svg+xml,video/mp4,video/webm,video/quicktime,video/x-matroska,audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/aac,audio/x-m4a,audio/ogg,audio/webm,audio/flac}
      - STORAGE_BACKEND=local
      - FRONTEND_URL=${FRONTEND_URL:-https://chiyeblog.cn}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-deepseek-v4-flash}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120}
      - TZ=Asia/Shanghai
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-https://chiyeblog.cn/api/v1/auth/github/callback}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-blog-media}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "1.5"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: blog-frontend
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  blog-data:
  blog-uploads:
  caddy-data:
  caddy-config:
