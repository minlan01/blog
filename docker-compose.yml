services:
  backend:
    build: ./backend
    container_name: blog-backend
    ports:
      - "6965:8000"
    volumes:
      - blog-data:/app/data
      - blog-uploads:/app/uploads
    environment:
      # ── App ──
      - APP_NAME=Personal Blog API
      - API_V1_PREFIX=/api/v1
      # ── Database (SQLite — stored in the blog-data volume) ──
      - SQLITE_DB_PATH=/app/data/blog.db
      # ── CORS — allow the frontend (port 80) and direct backend access ──
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:6965
      # ── Auth — leave empty to auto-generate on first run (persisted in volume) ──
      - SECRET_KEY=${SECRET_KEY:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # ── Admin account — password for the seed admin user (username: minlan01) ──
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-minlan01}
      # ── Uploads ──
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-5}
      - UPLOAD_ALLOWED_TYPES=image/png,image/jpeg,image/gif,image/webp,image/svg+xml
      # ── Frontend URL (for email links etc.) ──
      - FRONTEND_URL=http://localhost
      # ── DeepSeek API (optional — for AI chat feature) ──
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-deepseek-v4-flash}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: blog-frontend
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  blog-data:
  blog-uploads:
